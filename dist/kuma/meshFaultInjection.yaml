apiVersion: kuma.io/v1alpha1
kind: MeshFaultInjection
metadata:
  name: everything-fails
  namespace: the-store
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: Dataplane
    labels:
      app: catalog
  from:
    - targetRef:
        kind: MeshSubset
        tags:
          app.kubernetes.io/name: ui
          k8s.kuma.io/namespace: the-store
      default:
        http:
          - abort:
              httpStatus: 500
              percentage: 100
