apiVersion: kuma.io/v1alpha1
kind: MeshTrafficPermission
metadata:
  name: ui-to-catalog
  namespace: the-store
spec:
  targetRef:
    kind: MeshSubset
    tags:
      app.kubernetes.io/name: catalog
      k8s.kuma.io/namespace: the-store
  from:
    - targetRef:
        kind: MeshSubset
        tags:
          app.kubernetes.io/name: ui
          k8s.kuma.io/namespace: the-store
      default:
        action: Allow
---
