apiVersion: kuma.io/v1alpha1
kind: MeshTrafficPermission
metadata:
  namespace: the-store
  name: allow-all-the-store
spec:
  targetRef:
    kind: MeshSubset
    tags:
      k8s.kuma.io/namespace: the-store
  from:
    - targetRef:
        kind: MeshSubset
        tags:
          k8s.kuma.io/namespace: the-store
      default:
        action: Allow
