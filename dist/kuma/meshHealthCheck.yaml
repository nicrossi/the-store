apiVersion: kuma.io/v1alpha1
kind: MeshHealthCheck
metadata:
  name: ui-to-catalog-check
  namespace: the-store
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: Dataplane
    labels:
      app: ui
  to:
    - targetRef:
        kind: MeshService
        name: catalog_the-store_svc_80
      default:
        interval: 10s
        timeout: 2s
        unhealthyThreshold: 3
        healthyThreshold: 1
        tcp: { }
        http:
          disabled: true
    - targetRef:
        kind: MeshService
        name: carts_the-store_svc_80
      default:
        interval: 10s
        timeout: 2s
        unhealthyThreshold: 3
        healthyThreshold: 1
        tcp: { }
        http:
          disabled: true
    - targetRef:
        kind: MeshService
        name: checkout_the-store_svc_80
      default:
        interval: 10s
        timeout: 2s
        unhealthyThreshold: 3
        healthyThreshold: 1
        tcp: { }
        http:
          disabled: true
    - targetRef:
        kind: MeshService
        name: orders_the-store_svc_80
      default:
        interval: 10s
        timeout: 2s
        unhealthyThreshold: 3
        healthyThreshold: 1
        tcp: {}
        http:
          disabled: true
